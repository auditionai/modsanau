name: Protected release signing

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part Windows release version (for example 1.2.3.4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-signing
  cancel-in-progress: false

jobs:
  sign-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    environment: production-signing
    runs-on: [self-hosted, Windows, X64, audition-signing]
    timeout-minutes: 45
    env:
      SIGNTOOL_PATH: ${{ vars.AUDITION_SIGNTOOL_PATH }}
      SIGNING_PUBLISHER_SUBJECT: ${{ vars.AUDITION_SIGNING_PUBLISHER_SUBJECT }}
      TIMESTAMP_URL: ${{ vars.AUDITION_TIMESTAMP_URL }}
      SIGNING_CERTIFICATE_SHA1: ${{ secrets.AUDITION_SIGNING_CERTIFICATE_SHA1 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
      - name: Verify locked dependencies, vulnerability audit and SBOM
        shell: pwsh
        run: |
          dotnet restore AuditionModStudio.sln --locked-mode --nologo
          ./scripts/Invoke-DependencyAudit.ps1
          ./scripts/New-DependencySbom.ps1 -Verify
          ./scripts/Test-SupplyChainPolicy.ps1
      - name: Validate protected release configuration
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'RELEASE_VERSION_INVALID' }
          if (-not [IO.Path]::IsPathRooted($env:SIGNTOOL_PATH)) { throw 'SIGNTOOL_ABSOLUTE_PATH_REQUIRED' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PUBLISHER_SUBJECT)) { throw 'PUBLISHER_REQUIRED' }
          if ($env:TIMESTAMP_URL -notmatch '^https://') { throw 'HTTPS_TIMESTAMP_URL_REQUIRED' }
          if ($env:SIGNING_CERTIFICATE_SHA1 -notmatch '^[A-Fa-f0-9]{40}$') { throw 'CERTIFICATE_THUMBPRINT_INVALID' }
      - name: Publish exact unpackaged x64 release
        shell: pwsh
        run: >-
          dotnet publish src/AuditionModStudio.App/AuditionModStudio.App.csproj
          -c Release --self-contained true
          -p:WindowsPackageType=None
          -p:Version=${{ inputs.version }}
          -p:FileVersion=${{ inputs.version }}
          -p:AssemblyVersion=${{ inputs.version }}
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/release/win-x64
          --no-restore
          --nologo
      - name: Remove private symbols and reject public artifact exposure
        shell: pwsh
        run: >-
          ./scripts/Protect-ReleaseArtifactExposure.ps1
          -ArtifactRoot artifacts/release/win-x64
          -Prepare
      - name: Include supply-chain records
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release/supply-chain -Force | Out-Null
          Copy-Item docs/supply-chain/AuditionModStudio.spdx.json artifacts/release/supply-chain/
          Copy-Item docs/supply-chain/THIRD_PARTY_PROVENANCE.json artifacts/release/supply-chain/
          Copy-Item docs/supply-chain/DEPENDENCY_AND_REDISTRIBUTION.md artifacts/release/supply-chain/
      - name: Sign and verify app-owned artifacts
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath 'artifacts/release/win-x64').Path
          $files = @(Get-ChildItem -LiteralPath $root -File | Where-Object {
            $_.Name -eq 'AuditionModStudio.App.exe' -or $_.Name -like 'AuditionModStudio.*.dll'
          } | ForEach-Object FullName)
          ./scripts/Invoke-AppCodeSigning.ps1 -Mode Sign -ArtifactRoot $root -Artifacts $files `
            -SignToolPath $env:SIGNTOOL_PATH `
            -CertificateThumbprint $env:SIGNING_CERTIFICATE_SHA1 `
            -ExpectedPublisherSubject $env:SIGNING_PUBLISHER_SUBJECT `
            -TimestampUrl $env:TIMESTAMP_URL -RequireSignTool |
            Set-Content -LiteralPath 'artifacts/release/signing-report.json' -Encoding utf8
      - name: Scan signed release artifacts
        shell: pwsh
        run: ./scripts/Invoke-SecretScan.ps1 -Paths artifacts/release
      - name: Reject private obfuscation maps and reports
        shell: pwsh
        run: >-
          ./scripts/Test-ObfuscationArtifactPolicy.ps1
          -PublicArtifactRoot artifacts/release
          -Configuration Release
      - name: Upload signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audition-mod-studio-${{ inputs.version }}-${{ github.sha }}-signed
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
