name: Security secret scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
      - name: Restore exact locked graph
        run: dotnet restore AuditionModStudio.sln --locked-mode --nologo
      - name: Build Release artifacts
        run: dotnet build AuditionModStudio.sln -c Release --no-restore --nologo
      - name: Scan source, build, log and crash artifacts
        shell: pwsh
        run: >-
          ./scripts/Invoke-SecretScan.ps1
          -Paths src,tests,docs,supabase,scripts,
          src/AuditionModStudio.App/bin/Release,
          src/AuditionModStudio.Gateway/bin/Release,
          artifacts
