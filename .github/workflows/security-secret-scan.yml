name: Security secret scan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Release artifacts
        run: dotnet build AuditionModStudio.sln -c Release --nologo
      - name: Scan source, build, log and crash artifacts
        shell: pwsh
        run: >-
          ./scripts/Invoke-SecretScan.ps1
          -Paths src,tests,docs,supabase,scripts,
          src/AuditionModStudio.App/bin/Release,
          src/AuditionModStudio.Gateway/bin/Release,
          artifacts
